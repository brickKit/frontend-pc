# The static site (FP15, FP19, FP20). Behind the edge at /; the edge routes /api/ to the components, so a request for
# /api/ that reaches this server is answered 404, never the application's page.
server {
    listen 8501;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # the deployment's branding, written at start; never cached
    location = /config.json {
        include /etc/nginx/be-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        alias /tmp/be/config.json;
    }
    location = /version.json {
        include /etc/nginx/be-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # named by their content's digest: cached for good
    location /assets/ {
        include /etc/nginx/be-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /api/ {
        return 404;
    }
    # every other path is a page of the application (history routes): index.html, never cached
    location / {
        include /etc/nginx/be-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
